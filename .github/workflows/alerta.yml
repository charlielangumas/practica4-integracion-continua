name: Integracion Continua

on:
  push:
    branches:
      - main

jobs:
  hola-mundo:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Ejecutar Hola Mundo
        run: node app.js

      - name: Enviar notificacion a ntfy
        run: |
          curl -d "Se realizo un push correctamente a la rama main" https://ntfy.sh/devops-itla